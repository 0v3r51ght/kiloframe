[project]
name = "kiloframe"
version = "1.0.0"
description = "Local-first terminal AI agent powered by Ollama, with optional cloud providers"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["prompt_toolkit>=3.0", "Pygments>=2.15"]

[project.scripts]
kiloframe = "kiloframe.cli:main"
kiloframe-daemon = "kiloframe.daemon:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
